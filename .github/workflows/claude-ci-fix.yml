name: Claude – fix CI failure

on:
  workflow_run:
    # Failed tests/lint (CI) and failed agent reviews both start a fix attempt.
    workflows: [CI, "Claude – review PR"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  # Run subagents in the foreground. In a headless run, Claude Code exits when the
  # orchestrator ends its turn, which kills any subagent still running in the background.
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
  FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
  FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
  REVIEW_WORKFLOW: "Claude – review PR"
  # claude-review.yml tags each review comment with the reviewed commit.
  REVIEW_MARKER: "<!-- claude-review sha=${{ github.event.workflow_run.head_sha }} -->"
  MAX_ATTEMPTS: ${{ vars.CLAUDE_MAX_CI_FIX_ATTEMPTS || 3 }}
  MARKER: "<!-- claude-ci-fix-attempt -->"

jobs:
  fix:
    # Only failed runs on the agent's own branches in this repository (never forks).
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # PRs, comments and pushes all use this GitHub App token, so they show up as <app>[bot].
      # App-token pushes still trigger CI; pushes made with the default GITHUB_TOKEN would not.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Use app token and bot identity
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          bot_id=$(GH_TOKEN="$TOKEN" gh api "/users/${SLUG}[bot]" --jq .id)
          echo "GIT_BOT_NAME=${SLUG}[bot]" >> "$GITHUB_ENV"
          echo "GIT_BOT_EMAIL=${bot_id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_ENV"

      - name: Find PR and count previous attempts
        id: pr
        run: |
          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          read -r pr head_sha < <(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,headRefOid -q '.[0] // empty | "\(.number) \(.headRefOid)"') || true
          if [ -z "$pr" ]; then skip "No open PR for $BRANCH"; fi
          # CI and the review can both fail for one commit. Once a fix is pushed, the other
          # failure is outdated: the new commit gets checked and reviewed again.
          if [ "$head_sha" != "$FAILED_SHA" ]; then skip "Branch moved on since $FAILED_SHA; skipping"; fi
          mkdir -p "$RUNNER_TEMP/ci"
          if [ "$FAILED_WORKFLOW" = "$REVIEW_WORKFLOW" ]; then
            # Newest review of this commit (a re-run review posts another comment).
            review_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$REVIEW_MARKER\")) | .id" | tail -n 1)
            if [ -z "$review_id" ]; then skip "No review comment for $FAILED_SHA; nothing to fix"; fi
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$review_id" --jq .body > "$RUNNER_TEMP/ci/review.md"
            # No issues listed means the review itself broke (e.g. no result); code fixes won't help.
            if ! grep -q '^### Issues' "$RUNNER_TEMP/ci/review.md"; then
              skip "Review failed without listing issues; nothing to fix"
            fi
          fi
          attempts=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | length" | awk '{s+=$1} END {print s+0}')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "attempt=$((attempts + 1))" >> "$GITHUB_OUTPUT"
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            gh label create needs-human -R "$GITHUB_REPOSITORY" --color D93F0B \
              --description "Agent gave up; a human should look" --force
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --add-label needs-human
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body \
              "🤖 **Claude agent**: checks are still failing after $attempts automatic fix attempts. Stopping; labelled \`needs-human\`."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip == 'false'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Record attempt and collect failure logs
        if: steps.pr.outputs.skip == 'false'
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body \
            "$MARKER 🤖 **Claude agent**: automatic fix attempt ${{ steps.pr.outputs.attempt }}/$MAX_ATTEMPTS for failed $FAILED_WORKFLOW run $FAILED_RUN_ID."
          gh run view "$FAILED_RUN_ID" --log-failed | tail -c 60000 > "$RUNNER_TEMP/ci/failed.log" || true

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.skip == 'false'
        with:
          node-version: "24"
          cache: npm
      - if: steps.pr.outputs.skip == 'false'
        run: |
          npm ci
          git config user.name  "$GIT_BOT_NAME"
          git config user.email "$GIT_BOT_EMAIL"

      - name: Run agent
        if: steps.pr.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          show_full_output: true
          claude_args: >-
            --max-turns 80
            --add-dir ${{ runner.temp }}/ci
            --allowedTools "Agent,Task,Read,Write,Edit,Glob,Grep,TodoWrite,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"
          prompt: |
            The `${{ env.FAILED_WORKFLOW }}` check failed on branch `${{ env.BRANCH }}`
            (PR #${{ steps.pr.outputs.number }}).
            This is automatic fix attempt ${{ steps.pr.outputs.attempt }} of ${{ env.MAX_ATTEMPTS }}.
            Run subagents in the foreground and wait for each result; never end your turn while one
            is still running.
            Follow CLAUDE.md. Start every comment you post with `🤖 **Claude agent**` on its own line.

            1. Find the cause. Read the PR with `gh pr view ${{ steps.pr.outputs.number }} --comments`
               (it links the issue).
               - `CI` failed: read the failure log at `${{ runner.temp }}/ci/failed.log` and
                 reproduce locally with `npm run lint && npm run typecheck && npm test`.
                 Note CI runs Node 22, 24 and 26; the runner here has Node 24.
               - `${{ env.REVIEW_WORKFLOW }}` failed: the agent review found issues.
                 They are under "### Issues" in `${{ runner.temp }}/ci/review.md`. Fix each one
                 that is correct. If you are sure an item is wrong, do not change the code for it;
                 explain why in your PR comment.
            2. Decide which side is wrong. Do not edit files yourself:
               - anything outside tests/ (src/, README.md, docs/, config) -> `implementer`
               - wrong or flaky test -> `test-writer` (never just delete or weaken a correct test)
               If both sides need changes, run `test-writer` first, then `implementer`, one after
               the other (never in parallel).
            3. Verify locally until all checks pass (up to 3 rounds).
            4. Only after the fix passes locally, ask `reviewer` to check it. Address BLOCKING items (1 round).
            5. Commit (`fix CI: <summary>`) and `git push`. Do not force-push.
            6. Comment on the PR: cause of the failure and what changed (for a review failure,
               list each review issue and whether it was fixed or why not).
               If you could not find a fix, say so and stop without pushing.
