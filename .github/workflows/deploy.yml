name: Deploy

# Run by a human only: Actions → Deploy → Run workflow. Deploys the branch picked in
# "Use workflow from" with the secrets of the GitHub environment named by the repository variable
# DEPLOY_ENVIRONMENT (production if unset).
on:
  workflow_dispatch:

permissions:
  contents: read

# A second run waits instead of cutting the first off.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
